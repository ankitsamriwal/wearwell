<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e9f0">
<title>Wear - What Should I</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#e6e9f0; --bg2:#e6e9f0; --card:#e6e9f0; --card2:#e6e9f0;
  --line:#c8ccd6; --txt:#2d3444; --dim:#5a6172; --faint:#7a8194;
  --gold:#4a6fa5; --gold2:#3c5c88; --terra:#c25e2e; --sage:#4e7a3f; --sky:#2f6d9e; --rose:#b04a70;
  --r:18px;
  --raise:8px 8px 16px #c8ccd6,-8px -8px 16px #ffffff;
  --raise-sm:5px 5px 10px #c8ccd6,-5px -5px 10px #ffffff;
  --press:inset 4px 4px 8px #c8ccd6,inset -4px -4px 8px #ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding:0 16px 96px;position:relative}
h1,h2,h3,.display{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--txt);background:var(--bg2);border:none;box-shadow:var(--press);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus{box-shadow:var(--press),0 0 0 1.5px var(--gold2)}
label{font-size:.78rem;color:var(--dim);display:block;margin:14px 0 6px;letter-spacing:.03em}
img{display:block}

/* header */
.top{padding:22px 4px 6px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:1.5rem;font-weight:700;color:var(--gold)}
.brand small{display:block;font-family:-apple-system,sans-serif;font-size:.68rem;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:none;box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:1.05rem}

/* weather hero */
.weather{margin-top:12px;border-radius:16px;padding:10px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:2px 12px;background:var(--card);box-shadow:var(--raise-sm);border:none}
.weather .wloc{font-size:.68rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.weather .wtemp{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1;margin:0}
.weather .wcond{color:var(--dim);font-size:.8rem}
.weather .wmeta{display:flex;gap:10px;font-size:.7rem;color:var(--faint)}
.weather .wicon{width:30px;height:30px;opacity:.9}
.weather .wadvice{font-size:.72rem;color:var(--gold);flex-basis:100%}
/* clothes carousel - men / women / kids */
.wearcar{margin:14px -16px 2px;overflow:hidden;padding:18px 16px}
.wearcar .track{display:flex;gap:12px;width:max-content;animation:wcslide 36s linear infinite}
.wearcar .c{flex:0 0 auto;width:104px;background:var(--card);border-radius:16px;box-shadow:var(--raise);padding:7px}
.wearcar .c img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:11px;display:block;background:#dde4f0}
.wearcar .c .l{font-size:.64rem;font-weight:600;color:var(--dim);text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes wcslide{to{transform:translateX(-50%)}}

/* cards */
.card{background:var(--card);border:none;box-shadow:var(--raise);border-radius:var(--r);padding:16px;margin-top:14px}
.card h3{font-size:1.05rem;margin-bottom:4px}
.sub{color:var(--dim);font-size:.82rem}
.secttl{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.secttl h2{font-size:1.2rem}
.secttl button{color:var(--gold);font-size:.82rem}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:9px 16px;border-radius:999px;background:var(--bg2);border:none;box-shadow:var(--press);font-size:.85rem;color:var(--dim);transition:all .15s}
.chip.on{background:var(--gold);box-shadow:var(--raise-sm);color:#fff;font-weight:600}
.chip.sm{padding:6px 12px;font-size:.76rem}

/* big CTA */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px;border-radius:16px;background:linear-gradient(135deg,#5a7fb5,var(--gold));color:#fff;font-weight:700;font-size:1.02rem;margin-top:18px;box-shadow:0 6px 24px rgba(74,111,165,.25)}
.cta.ghost{background:var(--card2);color:var(--txt);border:none;box-shadow:var(--raise-sm);font-weight:600}
.cta:disabled{opacity:.45;box-shadow:none}

/* closet grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.gcell{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card2);border:none;box-shadow:var(--raise-sm);position:relative}
.gcell img{width:100%;height:100%;object-fit:cover}
.gcell .gt{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font-size:.62rem;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.gcell.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--gold);font-size:.75rem;border:1.5px dashed var(--gold2);background:rgba(74,111,165,.06);box-shadow:none}
.gcell.add .plus{font-size:1.6rem;font-weight:300}

/* outfit view */
.outfit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.oitem{background:var(--card2);border:none;box-shadow:var(--raise-sm);border-radius:14px;overflow:hidden}
.oitem img{width:100%;aspect-ratio:1;object-fit:cover}
.oitem .ol{padding:8px 10px}
.oitem .ol b{font-size:.8rem;display:block}
.oitem .ol span{font-size:.68rem;color:var(--faint)}
.slotrow{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.slotrow::-webkit-scrollbar{display:none}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow .cta{margin-top:0}

/* week */
.dayrow{background:var(--card);border:none;box-shadow:var(--raise-sm);border-radius:16px;padding:14px;margin-top:10px}
.dayrow .dh{display:flex;justify-content:space-between;align-items:center}
.dayrow .dh b{font-size:.95rem}
.dayrow .dh .dsub{font-size:.72rem;color:var(--faint)}
.dayrow .dthumbs{display:flex;gap:6px;margin-top:10px}
.dayrow .dthumbs img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.dayrow .dempty{margin-top:10px;font-size:.78rem;color:var(--faint)}
.mini{padding:7px 13px;border-radius:10px;background:var(--bg2);border:none;box-shadow:var(--press);font-size:.76rem;color:var(--dim)}
.mini.gold{color:var(--gold)}

/* insights */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border:none;box-shadow:var(--raise-sm);border-radius:16px;padding:16px}
.stat .n{font-size:1.9rem;font-weight:700;color:var(--gold)}
.stat .l{font-size:.72rem;color:var(--dim);margin-top:2px}
.irow{display:flex;gap:12px;align-items:center;background:var(--card);border:none;box-shadow:var(--raise-sm);border-radius:14px;padding:12px;margin-top:10px}
.irow img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.irow .ib{flex:1;min-width:0}
.irow .ib b{font-size:.85rem;display:block}
.irow .ib span{font-size:.72rem;color:var(--dim)}
.pill{font-size:.66rem;padding:4px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.pill.age{background:rgba(227,154,107,.15);color:var(--terra)}
.pill.cold{background:rgba(127,179,217,.15);color:var(--sky)}
.pill.gem{background:rgba(157,187,143,.15);color:var(--sage)}
.pill.rose{background:rgba(217,140,166,.15);color:var(--rose)}

/* bottom nav */
.nav{position:fixed;bottom:12px;left:12px;right:12px;background:var(--bg);border:none;border-radius:24px;box-shadow:var(--raise);z-index:50}
.navin{max-width:430px;margin:0 auto;display:flex}
.navin button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:.62rem;font-weight:600;letter-spacing:.03em}
.navin button.on{color:var(--gold)}
.navin .ni{width:22px;height:22px}

/* tour */
.tour{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;max-width:430px;margin:0 auto}
.tour .tbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px;overflow-y:auto}
.tour .tart{width:120px;height:120px;border-radius:32px;margin:0 auto 28px;display:flex;align-items:center;justify-content:center;background:var(--bg);box-shadow:var(--raise);border:none}
.tour h1{font-size:1.7rem;text-align:center;line-height:1.25}
.tour p{color:var(--dim);text-align:center;margin-top:14px;line-height:1.6;font-size:.92rem}
.tour .dots{display:flex;gap:7px;justify-content:center;margin:26px 0}
.tour .dot{width:7px;height:7px;border-radius:50%;background:#b9bfcc}
.tour .dot.on{background:var(--gold);width:22px;border-radius:4px}
.tour .tfoot{padding:0 32px 40px}

/* forms */
.photopick{margin-top:14px;border:1.5px dashed #b9bfcc;box-shadow:var(--press);border-radius:16px;aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--faint);font-size:.82rem;overflow:hidden;position:relative;background:var(--bg2)}
.photopick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photopick .big{font-size:1.8rem}
.frow{display:flex;gap:10px}
.frow>div{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;position:relative}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}

.backbar{display:flex;align-items:center;gap:10px;padding:20px 4px 4px}
.backbar button{color:var(--dim);font-size:.9rem;display:flex;align-items:center;gap:6px}
.backbar h2{font-size:1.25rem}
.empty{text-align:center;padding:40px 24px;color:var(--faint)}
.empty .et{font-weight:700;font-size:1.15rem;color:var(--dim);margin-bottom:8px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#2d3444;color:#eef0f5;border:none;padding:11px 20px;border-radius:999px;font-size:.83rem;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.25);white-space:nowrap}
.hidden{display:none!important}
.hr{height:1px;background:var(--line);margin:16px 0}
.kv{display:flex;justify-content:space-between;font-size:.83rem;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.kv span{color:var(--dim)}
.notice{background:var(--bg);box-shadow:var(--press);border:none;border-radius:14px;padding:13px 15px;font-size:.8rem;color:var(--gold);margin-top:14px;line-height:1.5}

/* sort my closet */
.steps{display:flex;gap:6px;margin:16px 0 2px}
.steps .st{flex:1;height:3px;border-radius:99px;background:var(--line)}
.steps .st.on{background:var(--gold)}
.cmpwrap{position:relative;margin-top:14px;border-radius:var(--r);overflow:hidden;border:none;box-shadow:var(--raise-sm)}
.cmpwrap img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.cmptag{position:absolute;top:10px;left:10px;background:rgba(230,233,240,.92);border:none;color:var(--gold);padding:4px 12px;border-radius:999px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
.cmpbtns{display:flex;gap:8px;margin-top:10px}
.cmpbtns .chip{flex:1}
.planrow{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid rgba(0,0,0,.05);font-size:.87rem;line-height:1.5}
.planno{font-weight:700;color:var(--gold);font-size:1.05rem;min-width:20px}
.orglinks{display:flex;gap:8px;margin-top:8px}
.orglinks a{flex:1;text-align:center;font-size:.76rem;color:var(--gold);border:none;box-shadow:var(--raise-sm);border-radius:10px;padding:8px 0;text-decoration:none}
.dimsrow{display:flex;gap:8px}
.dimsrow>div{flex:1}
.loadingdots:after{content:'';animation:ld 1.2s infinite steps(4)}
@keyframes ld{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.spacerow{display:flex;gap:10px;align-items:center}
.spacerow img{width:64px;height:80px;object-fit:cover;border-radius:10px}
</style>
</head>
<body>
<div id="tourRoot"></div>
<div class="app" id="app"></div>
<nav class="nav" id="nav"></nav>
<input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">
<script>
/* ============ Wear (What Should I) - on-device wardrobe stylist ============ */
const $=s=>document.querySelector(s);
const LS='ww_v1';
let S=load();if(!S.spaces)S.spaces=[];
function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.v===1)return d}catch(e){}
  return {v:1,items:[],outfits:[],weekPlan:null,spaces:[],tourDone:false,profile:{city:'Dubai',lat:25.2048,lon:55.2708}}}
function save(){localStorage.setItem(LS,JSON.stringify(S))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- IndexedDB photo store ---------- */
let _db;
function db(){return new Promise((res,rej)=>{if(_db)return res(_db);
  const r=indexedDB.open('ww-photos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('photos');
  r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}
async function putPhoto(id,blob){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('photos','readwrite');t.objectStore('photos').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function getPhoto(id){const d=await db();return new Promise(res=>{const r=d.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}
async function delPhoto(id){const d=await db();return new Promise(res=>{const t=d.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=res})}
const _urls={};
async function photoURL(id){if(_urls[id])return _urls[id];const b=await getPhoto(id);if(!b)return null;const u=URL.createObjectURL(b);_urls[id]=u;return u}

/* ---------- vocab ---------- */
const CATS=[
 {id:'top',n:'Top',ex:'tees, shirts, kurtas'},
 {id:'bottom',n:'Bottom',ex:'jeans, trousers, shorts'},
 {id:'dress',n:'Dress / One-piece',ex:'dresses, abayas, jumpsuits'},
 {id:'outer',n:'Outerwear',ex:'jackets, blazers, hoodies'},
 {id:'shoes',n:'Shoes',ex:'sneakers, heels, sandals'},
 {id:'acc',n:'Accessory',ex:'caps, bags, scarves'}];
const WARM=[{id:1,n:'Light',d:'hot days'},{id:2,n:'Mid',d:'mild weather'},{id:3,n:'Warm',d:'cool days'}];
const OCCS=[{id:'casual',n:'Casual'},{id:'work',n:'Work'},{id:'date',n:'Date'},{id:'sport',n:'Sport'},{id:'party',n:'Party'},{id:'travel',n:'Travel'}];
const TIMES=[{id:'morning',n:'Morning'},{id:'afternoon',n:'Afternoon'},{id:'evening',n:'Evening'},{id:'night',n:'Night'}];
const COLORS=[{id:'black',h:'#20232B'},{id:'white',h:'#F2F2EE'},{id:'grey',h:'#8A8F98'},{id:'beige',h:'#D8C6A5'},{id:'navy',h:'#2C3E5C'},{id:'blue',h:'#4A7FB5'},{id:'denim',h:'#5B7BA0'},{id:'green',h:'#6E9B6A'},{id:'olive',h:'#7A7A4D'},{id:'brown',h:'#8A6242'},{id:'red',h:'#B5524F'},{id:'pink',h:'#D99BB0'},{id:'yellow',h:'#E0C26A'},{id:'orange',h:'#D08A4E'},{id:'purple',h:'#8A6FAE'},{id:'multi',h:'linear-gradient(135deg,#B5524F,#E0C26A,#6E9B6A,#4A7FB5)'}];
const NEUT=['black','white','grey','beige','navy','denim','brown','olive'];
const colorName=id=>(COLORS.find(c=>c.id===id)||{}).id||'';
const catName=id=>(CATS.find(c=>c.id===id)||{}).n||id;
const occName=id=>(OCCS.find(o=>o.id===id)||{}).n||id;

/* ---------- weather ---------- */
let WX=null;
async function loadWeather(){
  const p=S.profile;
  try{
    const ac=new AbortController();const to=setTimeout(()=>ac.abort(),4000);
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`,{signal:ac.signal});clearTimeout(to);
    const j=await r.json();
    WX={t:Math.round(j.current.temperature_2m),feels:Math.round(j.current.apparent_temperature),code:j.current.weather_code,wind:Math.round(j.current.wind_speed_10m),prec:j.current.precipitation||0,hi:Math.round(j.daily.temperature_2m_max[0]),lo:Math.round(j.daily.temperature_2m_min[0]),rainP:j.daily.precipitation_probability_max?.[0]||0,ok:true};
  }catch(e){WX={ok:false}}
}
function wdesc(c){const m={0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Snow',80:'Rain showers',95:'Thunderstorm'};return m[c]||'Fair'}
function wicon(c){ // inline svg by condition family
  if(c===0||c===1)return '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="13" stroke="#E8C876" stroke-width="3"/><g stroke="#E8C876" stroke-width="3" stroke-linecap="round"><path d="M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4 4M45 45l4 4M49 15l-4 4M19 45l-4 4"/></g></svg>';
  if(c>=61&&c<=99||c>=51&&c<=57)return '<svg viewBox="0 0 64 64" fill="none"><path d="M18 40a12 12 0 1 1 3-23.6A14 14 0 0 1 48 22a10 10 0 0 1-2 18z" stroke="#7FB3D9" stroke-width="3"/><g stroke="#7FB3D9" stroke-width="3" stroke-linecap="round"><path d="M24 48l-2 6M34 48l-2 6M44 48l-2 6"/></g></svg>';
  return '<svg viewBox="0 0 64 64" fill="none"><circle cx="24" cy="24" r="9" stroke="#E8C876" stroke-width="3"/><path d="M18 46a11 11 0 1 1 2.8-21.7A13 13 0 0 1 46 29a9.5 9.5 0 0 1-2 17z" stroke="#9AA3B2" stroke-width="3"/></svg>';
}
function weatherAdvice(){
  if(!WX||!WX.ok)return 'Weather offline - picks will use mild-weather defaults.';
  const f=WX.feels,b=[];
  if(f>=38)b.push('Peak heat - lightest fabrics only');
  else if(f>=30)b.push('Hot - go light and breathable');
  else if(f>=22)b.push('Warm - light layers work');
  else if(f>=14)b.push('Mild - a mid layer is smart');
  else b.push('Cool - bring a warm layer');
  if(WX.rainP>=40||WX.prec>0)b.push('rain likely - cover up');
  if(WX.wind>=25)b.push('windy - secure layers');
  return b.join(' · ')+'.';
}

/* ---------- pick engine ---------- */
function eligible(occ){return S.items.filter(i=>!i.occ||i.occ.length===0||i.occ.includes(occ))}
function warmthWant(feels,time){
  // returns {maxWarm for base, needOuter, outerWarm}
  const night=(time==='evening'||time==='night');
  const f=night?feels-3:feels; // evenings run cooler
  if(f>=30)return{base:1,outer:0};
  if(f>=22)return{base:1,outer:night?1:0};
  if(f>=14)return{base:2,outer:1};
  return{base:2,outer:1,cold:true};
}
function pickOne(pool,used,prefer){
  let c=pool.filter(i=>!used.has(i.id));
  if(!c.length)return null;
  if(prefer){const p=c.filter(prefer);if(p.length)c=p}
  return c[Math.floor(Math.random()*c.length)];
}
function colorOK(outfit,item){
  if(!item)return true;
  const cols=outfit.filter(Boolean).map(i=>i.color).concat([item.color]);
  const nonN=cols.filter(c=>c&&!NEUT.includes(c)&&c!=='multi');
  return new Set(nonN).size<=2;
}
function buildOutfit(occ,time,excludeIds){
  const pool=eligible(occ);if(!pool.length)return null;
  const feels=(WX&&WX.ok)?WX.feels:26;
  const w=warmthWant(feels,time);
  const rain=WX&&WX.ok&&(WX.rainP>=40||WX.prec>0);
  const used=new Set(excludeIds||[]);
  const byCat=c=>pool.filter(i=>i.cat===c);
  const warmOK=i=>i.cat==='outer'?true:(i.warm||2)<=w.base+1;
  let out=[];
  const onePieces=byCat('dress').filter(i=>i.occ?.includes(occ)||!i.occ?.length);
  const useDress=onePieces.length&&occ!=='sport'&&(occ==='date'||occ==='party'||Math.random()<0.3);
  if(useDress){
    const d=pickOne(onePieces.filter(warmOK),used);if(d){out.push(d);used.add(d.id)}
  }else{
    const t=pickOne(byCat('top').filter(warmOK),used,i=>colorOK(out,i));if(t){out.push(t);used.add(t.id)}
    const b=pickOne(byCat('bottom').filter(warmOK),used,i=>colorOK(out,i));if(b){out.push(b);used.add(b.id)}
  }
  if(w.outer||rain){
    const o=pickOne(byCat('outer'),used,i=>(w.cold?(i.warm===3):true)&&colorOK(out,i));
    if(o){out.push(o);used.add(o.id)}
  }
  const sh=pickOne(byCat('shoes'),used,i=>colorOK(out,i));if(sh){out.push(sh);used.add(sh.id)}
  if(occ==='date'||occ==='party'||occ==='travel'||Math.random()<0.4){
    const a=pickOne(byCat('acc'),used);if(a){out.push(a);used.add(a.id)}
  }
  return out.length?out:null;
}
function scoreFreshness(out){ // prefer less-recently-worn
  let s=0;out.forEach(i=>{s+=i.wears?Math.min(i.wears,10):0});return s;
}
function bestOutfit(occ,time,avoid){
  let best=null,bs=1e9;
  for(let k=0;k<14;k++){const o=buildOutfit(occ,time,avoid&&k===0?null:avoid);if(!o)continue;
    if(avoid&&o.every(i=>avoid.includes(i.id)))continue;
    const s=scoreFreshness(o);if(s<bs){bs=s;best=o}}
  return best;
}

async function week(){
  if(!S.weekPlan)S.weekPlan={days:{}};
  const days=[];const now=new Date();
  for(let k=0;k<7;k++){const d=new Date(now);d.setDate(now.getDate()+k);days.push(d)}
  $('#app').innerHTML=header()+`
  <div class="secttl"><h2>Your week, styled</h2><button onclick="planWeek(true)">regenerate</button></div>
  <div class="sub" style="margin:0 4px">A full week of outfits from your closet - no repeats where possible. Tap a day to change its occasion or shuffle it.</div>
  ${!S.items.length?'<div class="notice">Add clothes to your closet first - the planner styles from what you own.</div>':''}
  <div id="wk"></div>`;
  if(!S.weekPlan.days||!Object.keys(S.weekPlan.days).length)planWeek(false);
  else renderWeek();
}
window.planWeek=function(force){
  const usedThisWeek=new Set();
  const days={};const now=new Date();
  for(let k=0;k<7;k++){
    const d=new Date(now);d.setDate(now.getDate()+k);
    const key=d.toISOString().slice(0,10);
    const dow=d.getDay(); // 0 Sun ... 6 Sat, Dubai work week Sun-Thu
    const prev=S.weekPlan?.days?.[key];
    const occ=(!force&&prev?.occ)?prev.occ:((dow>=0&&dow<=4)?'work':'casual');
    const time=(!force&&prev?.time)?prev.time:'morning';
    const o=bestOutfit(occ,time,null);
    let items=o||[];
    // avoid repeats where possible
    if(items.length&&usedThisWeek.size){
      let tries=0;
      while(tries<8&&items.some(i=>usedThisWeek.has(i.id))){
        const o2=buildOutfit(occ,time,[...usedThisWeek]);if(!o2)break;
        const fresh=o2.filter(i=>!usedThisWeek.has(i.id));
        if(fresh.length>=items.filter(i=>!usedThisWeek.has(i.id)).length)items=o2;
        tries++;
      }
    }
    items.forEach(i=>usedThisWeek.add(i.id));
    days[key]={occ,time,items:items.map(i=>i.id)};
  }
  S.weekPlan={days};save();renderWeek();
}
window.shuffleDay=function(key){
  const d=S.weekPlan.days[key];if(!d)return;
  const o=bestOutfit(d.occ,d.time,d.items);
  if(o)d.items=o.map(i=>i.id);save();renderWeek();
}
window.dayOcc=function(key,occ){S.weekPlan.days[key].occ=occ;shuffleDay(key)}
async function renderWeek(){
  const el=$('#wk');if(!el)return;
  const keys=Object.keys(S.weekPlan.days).sort();
  const rows=await Promise.all(keys.map(async key=>{
    const d=S.weekPlan.days[key];const dt=new Date(key+'T12:00:00');
    const label=dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    const thumbs=await Promise.all(d.items.slice(0,6).map(async id=>{const u=await photoURL(id);return u?`<img src="${u}">`:''}));
    return `<div class="dayrow">
      <div class="dh"><div><b>${label}</b><div class="dsub">${occName(d.occ)} · ${d.time}</div></div>
      <button class="mini gold" onclick="shuffleDay('${key}')">shuffle</button></div>
      ${d.items.length?`<div class="dthumbs">${thumbs.join('')}</div>`:'<div class="dempty">No outfit fits yet - add more clothes for this occasion.</div>'}
      <div class="chips" style="margin-top:10px">${OCCS.map(o=>`<button class="chip sm ${d.occ===o.id?'on':''}" onclick="dayOcc('${key}','${o.id}')">${o.n}</button>`).join('')}</div>
    </div>`}));
  el.innerHTML=rows.join('');
}

/* INSIGHTS */
async function insights(){
  $('#app').innerHTML=`<div class="backbar"><button onclick="back()">&#8592; Back</button><h2>Wardrobe insights</h2></div><div id="ins"></div>`;
  const el=$('#ins');
  if(!S.items.length){el.innerHTML=`<div class="empty"><div class="et">Nothing to analyse yet</div>Add your clothes and the insights come alive.</div>`;return}
  const withAge=S.items.filter(i=>i.bought).map(i=>({i,y:(Date.now()-new Date(i.bought).getTime())/(365.25*864e5)}));
  const old=withAge.filter(x=>x.y>=3).sort((a,b)=>b.y-a.y);
  const never=S.items.filter(i=>!i.wears);
  const most=[...S.items].filter(i=>i.wears).sort((a,b)=>b.wears-a.wears).slice(0,3);
  const totalWears=S.items.reduce((s,i)=>s+(i.wears||0),0);
  const priced=S.items.filter(i=>i.price>0);
  const spent=priced.reduce((s,i)=>s+ +i.price,0);
  const cpwAll=priced.length&&totalWears?(spent/Math.max(1,priced.reduce((s,i)=>s+(i.wears||0),0))):null;
  // category gaps vs weather
  const has=c=>S.items.some(i=>i.cat===c);
  const gaps=[];
  if(!has('outer')&&WX&&WX.ok&&WX.feels<20)gaps.push('No outerwear in your closet and it is cool out - a gap worth filling.');
  if(!has('shoes'))gaps.push('No shoes logged yet - outfits finish at the feet.');
  if(!S.items.some(i=>i.occ?.includes('sport'))&&S.items.length>5)gaps.push('Nothing tagged for sport.');
  if(!S.items.some(i=>i.occ?.includes('work'))&&S.items.length>5)gaps.push('Nothing tagged for work.');
  // stores
  const stores={};S.items.forEach(i=>{if(i.store)stores[i.store]=(stores[i.store]||0)+1});
  const topStore=Object.entries(stores).sort((a,b)=>b[1]-a[1])[0];

  let h=`<div class="statgrid">
    <div class="stat"><div class="n">${S.items.length}</div><div class="l">pieces tracked</div></div>
    <div class="stat"><div class="n">${totalWears}</div><div class="l">total wears logged</div></div>
    ${cpwAll?`<div class="stat"><div class="n">${cpwAll.toFixed(1)}</div><div class="l">avg cost per wear</div></div>`:''}
    ${withAge.length?`<div class="stat"><div class="n">${(withAge.reduce((s,x)=>s+x.y,0)/withAge.length).toFixed(1)}</div><div class="l">avg wardrobe age (yrs)</div></div>`:''}
  </div>`;
  if(old.length){
    h+=`<div class="secttl"><h2>Veterans</h2></div>`;
    for(const x of old.slice(0,4)){const u=await photoURL(x.i.id);
      h+=`<div class="irow">${u?`<img src="${u}">`:''}<div class="ib"><b>${esc(x.i.name||catName(x.i.cat))}</b><span>bought ${new Date(x.i.bought).toLocaleDateString('en-GB',{month:'short',year:'numeric'})}${x.i.store?' · '+esc(x.i.store):''} · worn ${x.i.wears||0}x</span></div><span class="pill age">${x.y.toFixed(1)} yrs old</span></div>`}
    h+=`<div class="notice">Pieces cross 3 years and Wear flags them - whether they are keepers worth tailoring, or ready to retire.</div>`;
  }
  if(never.length&&S.items.length>3){
    h+=`<div class="secttl"><h2>Never worn</h2></div>`;
    for(const i of never.slice(0,4)){const u=await photoURL(i.id);
      h+=`<div class="irow">${u?`<img src="${u}">`:''}<div class="ib"><b>${esc(i.name||catName(i.cat))}</b><span>${i.bought?'owned '+ageTxt(i.bought):'in your closet'} · zero wears</span></div><span class="pill cold">rediscover</span></div>`}
  }
  if(most.length){
    h+=`<div class="secttl"><h2>Hardest workers</h2></div>`;
    for(const i of most){const u=await photoURL(i.id);
      const cpw=(i.price&&i.wears)?' · '+(i.price/i.wears).toFixed(1)+' per wear':'';
      h+=`<div class="irow">${u?`<img src="${u}">`:''}<div class="ib"><b>${esc(i.name||catName(i.cat))}</b><span>${i.wears} wears${cpw}</span></div><span class="pill gem">earning it</span></div>`}
  }
  if(topStore)h+=`<div class="card"><h3>Where you shop</h3><div class="sub">${esc(topStore[0])} leads with ${topStore[1]} piece${topStore[1]>1?'s':''}${Object.keys(stores).length>1?', across '+Object.keys(stores).length+' stores total':''}.</div></div>`;
  if(gaps.length)h+=`<div class="secttl"><h2>Gaps</h2></div>`+gaps.map(g=>`<div class="notice" style="border-color:rgba(127,179,217,.3);color:var(--sky);background:rgba(127,179,217,.06)">${g}</div>`).join('');
  el.innerHTML=h;
}

window.setCity=async function(){
  const q=$('#s-city').value.trim();if(!q)return;
  try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1');

    S.profile={city:g.name+(g.country?', '+g.country:''),lat:g.latitude,lon:g.longitude};save();WX=null;await loadWeather();settings();toast('Weather set for '+g.name)}catch(e){toast('Lookup failed')}

window.useGPS=function(){if(!navigator.geolocation)return toast('Location unavailable');
  navigator.geolocation.getCurrentPosition(async p=>{S.profile.lat=p.coords.latitude;S.profile.lon=p.coords.longitude;
    try{const r=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&localityLanguage=en');const j=await r.json();S.profile.city=j.city||j.locality||'My location'}catch(e){S.profile.city='My location'}
    save();WX=null;await loadWeather();settings();toast('Location updated')},()=>toast('Permission denied'))}
window.exportData=async function(){
  const photos={};
  for(const i of S.items){const b=await getPhoto(i.id);if(b){photos[i.id]=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)})}}
  const blob=new Blob([JSON.stringify({v:1,data:S,photos})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wearwell-backup.json';a.click();toast('Backup downloaded');
}
window.importData=function(){
  const f=document.createElement('input');f.type='file';f.accept='application/json';
  f.onchange=async()=>{try{const j=JSON.parse(await f.files[0].text());
    if(!j.data||j.data.v!==1)throw 0;
    S=j.data;save();
    for(const[id,du]of Object.entries(j.photos||{})){const b=await (await fetch(du)).blob();await putPhoto(id,b)}

}

function ageNudge(force){
  S.notif=S.notif||{nudgedIds:[]};
  const vets=S.items.filter(i=>{const a=ageTxt(i.bought);return a&&a.includes('yrs')&&parseFloat(a)>=3});
  const fresh=vets.filter(i=>!S.notif.nudgedIds.includes(i.id));
  if(!fresh.length&&!force)return;
  const names=fresh.slice(0,3).map(i=>i.name||catName(i.cat));
  const body=fresh.length?names.join(', ')+(fresh.length>3?' and '+(fresh.length-3)+' more':'')+(fresh.length===1?' just crossed':' just crossed')+' 3 years - keeper or retire?':'Aging nudges are on. We will flag pieces as they turn 3.';
  if('Notification' in window&&Notification.permission==='granted'){
    try{new Notification('Wear',{body,icon:'icons/icon-192.png',tag:'age-nudge'})}catch(e){}
  }
  S.notif.nudgedIds=[...new Set([...S.notif.nudgedIds,...fresh.map(i=>i.id)])];
  save();
}

    </div>
    ${st.plan.length?`<div class="secttl"><h2>The sorting plan</h2></div><div class="card">${st.plan.map((p,i)=>`<div class="planrow"><div class="planno">${i+1}</div><div>${esc(p)}</div></div>`).join('')}</div>`:''}
    ${st.orgs.length?`<div class="secttl"><h2>Organizers worth buying</h2></div>`+st.orgs.map(o=>`<div class="card"><h3>${esc(o.n)}</h3><div class="sub">${esc(o.w)}</div><div class="sub" style="color:var(--faint);font-size:.72rem;margin-top:4px">${esc(o.s)}</div><div class="orglinks"><a href="https://www.amazon.ae/s?k=${o.q}" target="_blank" rel="noopener">Amazon.ae</a><a href="https://www.ikea.com/ae/en/search/?q=${o.q.replace(/\+/g,'%20')}" target="_blank" rel="noopener">IKEA</a></div></div>`).join(''):''}
    <button class="cta ghost" onclick="SORT=null;go('sort')">Sort another closet</button>`;
  }
  $('#app').innerHTML=h;
}
window.viewSpace=function(id){go('sort',id)}

window.pickSortPhoto=function(){const f=$('#fileInput');f.multiple=false;f.value='';
  f.onchange=async()=>{const file=f.files[0];if(!file)return;
    const blob=await downscaleBig(file);SORT.photoId=uid();await putPhoto(SORT.photoId,blob);
    SORT.err=null;sort()};f.click()}
function downscaleBig(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const m=1400;let{width:w,height:h}=img;const s=Math.min(1,m/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  c.toBlob(b=>res(b),'image/jpeg',0.85)};img.src=URL.createObjectURL(file)})}

window.analyzeSort=async function(){
  if(SORT.busy)return;SORT.busy=true;SORT.err=null;sort();
  try{
    const blob=await getPhoto(SORT.photoId);
    const a=await aiAnalyzeCloset(blob);
    SORT.analysis=a;SORT.fallback=false;
    if(a.closet_type&&SORT_TYPES.some(t=>t.id===a.closet_type))SORT.type=a.closet_type;
    if(a.estimated_dims_cm&&a.estimated_dims_cm.w)SORT.dims={w:Math.round(a.estimated_dims_cm.w),h:Math.round(a.estimated_dims_cm.h||200),d:Math.round(a.estimated_dims_cm.d||55)};
    SORT.step=2;
  }catch(e){
    try{const blob=await getPhoto(SORT.photoId);const a=await localScan(blob);
      SORT.analysis=a;SORT.fallback=true;SORT.step=2;
    }catch(e2){SORT.err='Could not read that photo - try another angle with better light.'}
  }
  SORT.busy=false;sort();
}

async function aiAnalyzeCloset(blob){
  const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(blob)});
  const sys='You are a professional closet organiser analysing a photo of an open closet. Reply with strict JSON only, no markdown, no commentary: {"closet_type":"wardrobe|almirah|open_shelf|walk_in","estimated_dims_cm":{"w":number,"h":number,"d":number},"compartments":[{"kind":"rail|shelf|drawer|box|floor","count":number,"holds":"what it currently holds, 3-6 words"}],"clutter":"one honest sentence on the current state","quick_wins":["short action","short action","short action"]}. Estimate real dimensions in centimetres from standard furniture proportions. List every distinct compartment you can see.';
  const body={system_instruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:'Analyse this closet photo.'},{inline_data:{mime_type:'image/jpeg',data:b64}}]}]};
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),45000);
  const r=await fetch(SORT_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ac.signal});
  clearTimeout(to);
  if(!r.ok)throw new Error('ai_'+r.status);
  const j=await r.json();
  const t=(j.text||'').replace(/```json|```/g,'').trim();
  const a=JSON.parse(t);
  if(!a||!Array.isArray(a.compartments)||!a.compartments.length)throw new Error('bad_analysis');
  a.compartments=a.compartments.filter(c=>c&&c.kind).slice(0,10);
  return a;
}

function localScan(blob){return new Promise((res,rej)=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const w=160,h=Math.round(w*img.height/img.width);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;
  const g=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
  const rows=new Float32Array(h),cols=new Float32Array(w);
  for(let y=1;y<h;y++)for(let xx=0;xx<w;xx++)rows[y]+=Math.abs(g[y*w+xx]-g[(y-1)*w+xx]);
  for(let xx=1;xx<w;xx++)for(let y=0;y<h;y++)cols[xx]+=Math.abs(g[y*w+xx]-g[y*w+xx-1]);
  const peaks=(arr,minGapF)=>{const th=arr.reduce((s,v)=>s+v,0)/arr.length*1.8;const out=[];let last=-1e9;const minGap=arr.length*minGapF;
    for(let i=1;i<arr.length-1;i++){if(arr[i]>th&&arr[i]>=arr[i-1]&&arr[i]>=arr[i+1]&&i-last>=minGap){out.push(i);last=i}}return out};
  const shelves=Math.max(1,peaks(rows,.08).length), secs=Math.max(1,peaks(cols,.15).length+1);
  res({closet_type:'wardrobe',estimated_dims_cm:{w:120,h:200,d:55},
    compartments:[{kind:'shelf',count:shelves,holds:'detected shelf levels'},{kind:'rail',count:secs,holds:'vertical sections'}],
    clutter:'On-device read of the photo - roughly '+shelves+' shelf level'+(shelves>1?'s':'')+' across '+secs+' section'+(secs>1?'s':'')+'.',
    quick_wins:['Empty one shelf at a time','Fold into stacks of five','Box what you rarely wear']});
};img.src=URL.createObjectURL(blob)})}

window.confirmDims=function(){
  SORT.dims={w:Math.max(40,parseInt($('#d-w').value)||120),h:Math.max(40,parseInt($('#d-h').value)||200),d:Math.max(20,parseInt($('#d-d').value)||55)};
  SORT.step=4;SORT.plan=buildPlan();SORT.orgs=buildOrgs();sort();
  if(SORT.genState!=='working'&&!SORT.afterId){SORT.genState='working';SORT.genErr=null;
    genAfter().then(()=>{SORT.genState='done';SORT.showAfter=true;saveSpace();sort()})
      .catch(()=>{SORT.genState='idle';SORT.genErr='The after-state image service is busy - your plan below is ready, and the photo comparison will work next visit.';saveSpace();sort()})}
}
function saveSpace(){
  const sp={id:SORT.spaceId||uid(),photoId:SORT.photoId,type:SORT.type,dims:SORT.dims,analysis:SORT.analysis,plan:SORT.plan,orgs:SORT.orgs,afterId:SORT.afterId||null,created:new Date().toISOString()};
  SORT.spaceId=sp.id;
  const i=S.spaces.findIndex(x=>x.id===sp.id);if(i>=0)S.spaces[i]=sp;else S.spaces.unshift(sp);save();
}

function buildPlan(){
  const cs=(SORT.analysis&&SORT.analysis.compartments)||[];
  const has=k=>cs.some(c=>c.kind===k);const p=[];
  if(has('rail'))p.push('Hang everything long first - shirts and kurtas to the left, dresses and abayas to the right, colours running light to dark.');
  if(has('shelf'))p.push('Fold into stacks of five to seven, heaviest at the bottom, one category per stack.');
  if(has('drawer'))p.push('File-fold tees and innerwear vertically, so every piece is visible at a glance.');
  if(has('box'))p.push('Re-box by theme - accessories, seasonal, seldom-worn - and label every box on its face.');
  if(has('floor'))p.push('Shoes in pairs, heel to toe; anything without a pair leaves the floor.');
  ((SORT.analysis&&SORT.analysis.quick_wins)||[]).forEach(q=>{if(q&&!p.some(x=>x.toLowerCase()===String(q).toLowerCase()))p.push(String(q))});
  return p.slice(0,6);
}
function buildOrgs(){
  const cs=(SORT.analysis&&SORT.analysis.compartments)||[];
  const has=k=>cs.some(c=>c.kind===k);const o=[];
  const shelfW=Math.min(45,Math.max(25,Math.round(SORT.dims.w/3)));
  if(has('rail'))o.push({n:'Slim velvet hangers, 30-pack',w:'Matching slim hangers free up to a fifth of the rail and stop slip-offs.',s:'40cm adult size',q:'slim+velvet+hangers'});
  if(has('shelf'))o.push({n:'Shelf dividers, set of 4',w:'Keep folded stacks upright instead of toppling into each other.',s:'fits shelves up to '+SORT.dims.d+'cm deep',q:'shelf+dividers+set'});
  if(has('shelf')||has('box'))o.push({n:'Fabric storage boxes with lids',w:'Dust-free homes for seasonal and seldom-worn pieces.',s:'about '+shelfW+'cm wide to sit two-across on your shelves',q:'fabric+storage+box+with+lid'});
  if(has('drawer'))o.push({n:'Drawer organiser cells, set of 6',w:'Socks, innerwear and accessories each get their own cell.',s:'28 x 28 x 10cm cells',q:'drawer+organizer+set'});
  if(has('floor'))o.push({n:'Two-tier shoe rack',w:'Lifts pairs off the floor and doubles the row.',s:'60cm wide fits a '+SORT.dims.w+'cm closet',q:'shoe+rack+2+tier'});
  o.push({n:'Vacuum storage bags',w:'Off-season bulk shrinks to a third of its size and lives on the top shelf.',s:'large 70 x 100cm',q:'vacuum+storage+bags'});
  return o.slice(0,5);
}

function afterPrompt(){
  const t=(SORT_TYPES.find(t=>t.id===SORT.type)||SORT_TYPES[0]).n.toLowerCase();
  const cs=(SORT.analysis&&SORT.analysis.compartments)||[];
  const comp=cs.map(c=>(c.count>1?c.count+' ':'a ')+(c.kind==='rail'?'hanging rail':c.kind)+(c.count>1?'s':'')).join(', ')||'hanging rails and shelves';
  return 'photorealistic interior photograph of a neatly organised '+t+', '+SORT.dims.w+'cm wide and '+SORT.dims.h+'cm tall, with '+comp+', clothes folded in tidy even stacks, shirts on matching slim hangers arranged by colour, labelled beige fabric storage boxes, everything aligned and symmetrical, soft warm daylight, no people, no text';
}
async function genAfter(){
  const url='https://image.pollinations.ai/prompt/'+encodeURIComponent(afterPrompt())+'?width=768&height=1024&nologo=true&seed='+Math.floor(Math.random()*1e6);
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),90000);
  const r=await fetch(url,{signal:ac.signal});clearTimeout(to);
  if(!r.ok)throw new Error('img_'+r.status);
  const b=await r.blob();
  if(!b||b.size<8000)throw new Error('img_empty');
  SORT.afterId=uid();await putPhoto(SORT.afterId,b);
}

/* ---------- boot ---------- */
(async function(){
  await loadWeather();
  if('serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js')}catch(e){}
  if(!S.tourDone)startTour();else render();
  if(S.tourDone)setTimeout(()=>ageNudge(false),2500);
})();
</script>
